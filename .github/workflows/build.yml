name: Build CuraPro CL

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install
      - name: Descargar librerías para uso sin internet
        run: npm run vendor
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Generar íconos y splash
        run: npx capacitor-assets generate --android
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CuraPro-CL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CuraPro-CL-APK
          path: CuraPro-CL.apk

  windows:
    name: Instalador Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Descargar librerías para uso sin internet
        run: npm run vendor
      - name: Crear instalador
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: CuraPro-CL-Windows
          path: dist/*.exe

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
